<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiriFinder — หาไฟล์ซ้ำ</title>
<style>
/* โทเคนชุดเดียวกับ SiriLoader — เปลี่ยนแค่ accent เป็น burgundy */
:root{
  --accent:#9b2343; --accent-hover:#7d1a35; --accent-soft:#f7e4e9; --accent-text:#8e2040;
  --window:#ffffff; --chrome:#f6f6f8; --side:#f3f3f6;
  --line:#e3e3e6; --row-line:#eeeef0;
  --text:#1d1d1f; --muted:#8a8a8f;
  --control:#ffffff; --control-line:#d0d0d6;
  --hover:rgba(0,0,0,.05); --danger:#c0392b; --ok:#1c7f4e; --track:#e6e8ef;
  color-scheme:light dark;
  font:13px -apple-system,"SF Pro Text","Noto Sans Thai","Sukhumvit Set","Helvetica Neue",sans-serif;
  color:var(--text); background:var(--window); -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){:root{
  --accent:#b8325a; --accent-hover:#c9436b; --accent-soft:rgba(200,80,110,.22); --accent-text:#e9a7b8;
  --window:#1e1e20; --chrome:#2a2a2d; --side:#252528;
  --line:#3a3a3e; --row-line:#2e2e31;
  --text:#ececef; --muted:#8e8e94;
  --control:#3a3a3e; --control-line:#4a4a4f;
  --hover:rgba(255,255,255,.07); --danger:#ff6b5e; --ok:#5fd694; --track:#3a3a3e;
}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--window);cursor:default}
button{font:inherit;color:inherit;border:0;background:none;cursor:default;padding:0}
input,select{font:inherit;color:inherit}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--muted)}
.hide{display:none!important}
.grow{flex:1;min-width:0}
.row-f{display:flex;align-items:center;gap:8px}

/* ---- toolbar 52px ---- */
.toolbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;width:188px;flex-shrink:0}
.brand .mark{width:24px;height:24px;border-radius:6px;background:var(--accent);
  display:grid;place-items:center;flex-shrink:0}
.brand b{font-size:13px;font-weight:600}
.search{flex:1;max-width:380px;height:28px;padding:0 10px;border-radius:7px;
  background:var(--control);border:1px solid var(--control-line);outline:none}
.search:focus{border-color:var(--accent)}
.tool{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);flex-shrink:0}
.tool:hover{background:var(--hover);color:var(--text)}

/* ---- body / sidebar ---- */
.body{flex:1;display:flex;min-height:0}
.side{width:200px;flex-shrink:0;overflow-y:auto;background:var(--side);
  border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:1px}
.side h6{font-size:11px;font-weight:600;color:var(--muted);padding:10px 10px 4px;margin:0}
.item{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:6px;
  text-align:left;color:var(--text);width:100%}
.item svg{color:var(--accent-text);flex-shrink:0}
.item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item b{font-weight:500;font-size:12px;color:var(--muted)}
.item:hover{background:var(--hover)}
.item.on{background:var(--accent);color:#fff}
.item.on svg,.item.on b{color:#fff}
.side .foot{margin-top:auto;padding:10px;font-size:11px;line-height:1.6;color:var(--muted);
  border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---- แถบบนของเนื้อหา ---- */
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--chrome)}
.bar.plain{background:var(--window)}
.btn{height:28px;padding:0 12px;border-radius:7px;background:var(--control);
  border:1px solid var(--control-line);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:500}
.btn.quiet{background:none;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--hover);color:var(--text)}
.btn:disabled{opacity:.4}
.btn.sm{height:26px;padding:0 9px}
input.f,select.f{height:28px;padding:0 8px;border-radius:7px;background:var(--control);
  border:1px solid var(--control-line);outline:none}
input.f:focus,select.f:focus{border-color:var(--accent)}
label.ck{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0}
.lbl{font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0}

/* ---- ตัวเลขสรุป ---- */
.metrics{display:flex;gap:28px;padding:12px 16px;flex-shrink:0;border-bottom:1px solid var(--line)}
.metric .k{font-size:11px;font-weight:600;color:var(--muted)}
.metric .v{font-size:19px;font-weight:600;margin-top:1px}
.metric.hero .v{color:var(--accent-text)}

/* ---- progress ---- */
.prog{padding:8px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.track{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .3s}

/* ---- รายการ (เลื่อนเฉพาะตรงนี้) ---- */
.list{flex:1;overflow-y:auto;min-height:0}
.grp{border-bottom:1px solid var(--line)}
.grp>.hd{display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--chrome);
  border-bottom:1px solid var(--row-line);font-size:11px;font-weight:600;color:var(--muted);
  position:sticky;top:0;z-index:2}
.grp>.hd .plain{font-weight:400}
.grp>.hd .hash{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-weight:400;opacity:.7}
.f{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--row-line)}
.f:hover{background:var(--hover)}
.f.sel{background:var(--accent-soft)}
.f.keep{box-shadow:inset 2px 0 0 var(--ok)}
.f.sel{box-shadow:inset 2px 0 0 var(--accent)}
.f input[type=checkbox]{flex:none;width:15px;height:15px}
.thumb{width:44px;height:44px;flex:none;border-radius:6px;object-fit:cover;background:var(--accent-soft);
  display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--accent-text);overflow:hidden}
.pathwrap{flex:1;min-width:0}
.p{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .dir{color:var(--muted)}
.p .name{font-weight:600}
.meta{font-size:11px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;flex:none;display:none}
.f.sel .tag.del{display:inline-block;background:var(--accent);color:#fff}
.f.keep .tag.keep{display:inline-block;background:var(--accent-soft);color:var(--ok)}
.f .btn.reveal{opacity:0}
.f:hover .btn.reveal,.f:focus-within .btn.reveal{opacity:1}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;
  font-size:11px;font-weight:600;background:var(--hover);color:var(--muted)}
.badge.production{color:var(--ok)} .badge.mock{color:#9a6b00}
.badge.wine,.badge.integrated{color:var(--accent-text)}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.skeleton{padding:16px}
.skeleton i{display:block;height:10px;border-radius:3px;background:var(--hover);margin-bottom:9px}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;padding:14px}
.card{padding:0}

/* ---- ถังพักไฟล์ ---- */
.qhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--row-line)}
.qhead .caret{color:var(--muted);transition:transform .2s}
.qhead.open .caret{transform:rotate(90deg)}
.qbody{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--chrome)}
.qtools{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--control-line);border-radius:7px;overflow:hidden}
.seg button{padding:4px 11px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;font-weight:500}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.qcell{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--window)}
.qcell .th{width:100%;aspect-ratio:1;object-fit:cover;background:var(--accent-soft);
  display:grid;place-items:center;font-size:11px;color:var(--accent-text)}
.qcell .cap{padding:6px 8px;font-size:11px;line-height:1.4;word-break:break-all}
.qcell .cap b{display:block;font-weight:600}
.qcell .cap span{color:var(--muted)}
.qrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--row-line)}
.qmore{text-align:center;padding-top:10px}

/* ---- แถบล่าง ---- */
.actionbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 14px;height:48px;
  background:var(--chrome);border-top:1px solid var(--line)}
.actionbar .count{font-weight:600}
.msg{color:var(--muted);font-size:12px}

/* ---- modal / toast ---- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--window);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 24px 48px rgba(0,0,0,.28);width:min(860px,100%);max-height:84vh;
  display:flex;flex-direction:column;overflow:hidden}
.sheet>.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet>.top b{font-size:14px}
.sheet>.bot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);
  background:var(--chrome);flex-wrap:wrap}
.pkbody{display:flex;flex:1;min-height:0}
.pkside{width:190px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:8px;background:var(--side)}
.pkside .grp-label{font-size:11px;font-weight:600;color:var(--muted);padding:10px 10px 4px}
.pkside button{display:block;width:100%;text-align:left;padding:5px 10px;border-radius:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkside button:hover{background:var(--hover)}
.pkmain{flex:1;min-width:0;display:flex;flex-direction:column}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:8px 12px;
  border-bottom:1px solid var(--line);font-size:12px}
.crumbs button{padding:2px 6px;border-radius:5px;color:var(--accent-text);font-weight:500}
.crumbs button:hover{background:var(--hover)}
.crumbs .sep{color:var(--muted)}
.pklist{flex:1;overflow-y:auto;padding:6px}
.pklist button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 10px;border-radius:6px}
.pklist button:hover{background:var(--hover)}
.pklist button.dim{color:var(--muted)}
.pklist .arrow{margin-left:auto;color:var(--muted)}
.err{color:var(--danger)} .ok{color:var(--ok)}
.toasts{position:fixed;right:16px;bottom:62px;z-index:55;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--window);border:1px solid var(--line);border-left:3px solid var(--muted);
  border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:9px 14px;max-width:380px;font-size:12px}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--danger)}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 1024 1024" width="15" height="15" fill="none"
      stroke="#fff" stroke-width="98" stroke-linecap="round">
      <g transform="translate(512 512) scale(.84) translate(-512 -512)">
      <g transform="translate(-118 0)" stroke-opacity=".45"><path d="M616 332 A120 120 0 1 0 512 512 A120 120 0 1 1 408 692"/></g>
      <g transform="translate(118 0)"><path d="M616 332 A120 120 0 1 0 512 512 A120 120 0 1 1 408 692"/></g></g></svg></div>
    <b>SiriFinder</b>
  </div>
  <input id="q" type="search" class="search" placeholder="กรองด้วยบางส่วนของ path…"
         onkeydown="if(event.key==='Enter')reload(0)">
  <button class="tool" title="กรอง" onclick="reload(0)">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
  </button>
  <span id="hdrStatus"></span>
</div>

<div class="body">
  <div class="side">
    <h6>WORKSPACE</h6>
    <button id="navScan" class="item on" onclick="showTab('scan')">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round"><circle cx="6.8" cy="6.8" r="4.3"/><path d="M10 10 14 14"/></svg>
      <span>สแกนและตรวจ</span></button>
    <button id="navQ" class="item" onclick="showTab('q')">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linejoin="round"><path d="M1.8 4.6h12.4v8.1a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z"/>
        <path d="M1.2 2.3h13.6v2.3H1.2zM6.3 7.7h3.4"/></svg>
      <span>ถังพักไฟล์</span><b id="navQCount"></b></button>
    <div class="foot">ปุ่มลบ <b style="color:var(--text)">ย้ายไปถังพัก</b><br>ไม่ได้ลบจริง คืนกลับได้</div>
  </div>

  <div class="main">
    <!-- ---------------- สแกน ---------------- -->
    <div id="paneScan" class="pane">
      <div class="bar" id="scanFull">
        <input id="root" class="f grow mono" placeholder="เช่น ~/Pictures หรือกดปุ่มเลือกโฟลเดอร์"
               onkeydown="if(event.key==='Enter')startScan()">
        <button class="btn" onclick="pkOpen('root')">เลือกโฟลเดอร์…</button>
        <span class="lbl">ข้ามไฟล์เล็กกว่า</span>
        <select id="minsize" class="f">
          <option value="0">ไม่จำกัด</option><option value="1024">1 KB</option>
          <option value="4096" selected>4 KB</option><option value="1048576">1 MB</option>
          <option value="10485760">10 MB</option>
        </select>
        <label class="ck"><input type="checkbox" id="hidden"> ไฟล์ซ่อน</label>
        <button id="btnScan" class="btn primary" onclick="startScan()">เริ่มสแกน</button>
        <button id="btnCancel" class="btn danger hide" onclick="api('/api/cancel',{})">หยุด</button>
      </div>
      <div class="bar hide" id="scanSlim">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
          stroke-width="1.5" style="color:var(--muted);flex:none"><path d="M1.5 4.2h4.6l1.2 1.5h7.2v7.6a1 1 0 0 1-1 1H2.5a1 1 0 0 1-1-1z"/></svg>
        <span class="mono grow" id="slimPath" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <span class="muted" id="slimCount"></span>
        <button class="btn sm" onclick="editScan()">สแกนใหม่</button>
      </div>
      <div id="prog" class="prog hide">
        <div class="row-f"><span class="meta grow" id="progText" style="margin:0"></span>
          <span class="meta mono" id="progPct" style="margin:0"></span></div>
        <div class="track"><i id="progBar"></i></div>
      </div>
      <div id="scanErr" class="err hide" style="padding:8px 16px"></div>

      <div class="metrics">
        <div class="metric"><div class="k">กลุ่มไฟล์ซ้ำ</div><div class="v" id="sGroups">–</div></div>
        <div class="metric"><div class="k">ไฟล์ที่เกินมา</div><div class="v" id="sFiles">–</div></div>
        <div class="metric hero"><div class="k">พื้นที่ที่กู้คืนได้</div><div class="v" id="sWaste">–</div></div>
      </div>
      <span id="sIndexed" class="hide"></span>

      <div class="bar plain">
        <span class="lbl">เก็บ</span>
        <select id="rule" class="f">
          <option value="old">ตัวที่เก่าที่สุด</option><option value="new">ตัวที่ใหม่ที่สุด</option>
          <option value="short">ตัวที่ path สั้นที่สุด</option>
          <option value="prefer">ตัวที่อยู่ในโฟลเดอร์…</option>
        </select>
        <input id="prefer" class="f grow mono hide" placeholder="โฟลเดอร์ที่อยากเก็บไว้">
        <button id="btnPrefPick" class="btn sm hide" onclick="pkOpen('prefer')">เลือก…</button>
        <button class="btn sm" onclick="autoSelect()">ติ๊กตัวที่เหลือ</button>
        <button class="btn sm quiet" onclick="clearSel()">ล้าง</button>
        <div class="grow"></div>
        <select id="sort" class="f" onchange="reload(0)">
          <option value="waste">เสียพื้นที่มากสุด</option><option value="size">ไฟล์ใหญ่สุด</option>
          <option value="count">ซ้ำเยอะสุด</option><option value="path">path (A→Z)</option>
        </select>
        <select id="pagesize" class="f" onchange="reload(0)">
          <option value="20">20 /หน้า</option><option value="40" selected>40 /หน้า</option>
          <option value="100">100 /หน้า</option><option value="200">200 /หน้า</option>
        </select>
      </div>

      <div class="list"><div id="groups"></div><div class="pager" id="pager"></div></div>
    </div>

    <!-- ---------------- ถังพักไฟล์ ---------------- -->
    <div id="paneQ" class="pane hide">
      <div class="bar">
        <span class="lbl">ถังพักที่ค้างอยู่</span>
        <input id="findPath" class="f grow mono" placeholder="ค้นหาในโฟลเดอร์…">
        <button class="btn" onclick="pkOpen('findPath')">เลือก…</button>
        <button class="btn primary" onclick="findQ()">ค้นหา</button>
      </div>
      <div class="list"><div id="findOut"></div><div id="batches"></div></div>
    </div>
  </div>
</div>

<div class="actionbar">
  <span class="count" id="selCount">0</span><span class="muted">ไฟล์</span>
  <span class="muted" id="selBytes"></span>
  <div class="grow"></div>
  <span class="msg" id="msg"></span>
  <button class="btn quiet hide" id="btnClear" onclick="clearSel()">ล้างที่เลือก</button>
  <button class="btn danger" id="btnDel" disabled onclick="doDelete()">ย้ายไปถังพักไฟล์</button>
</div>

<div class="toasts" id="toasts"></div>

<div id="picker" class="modal hide">
  <div class="sheet">
    <div class="top"><b id="pkTitle" style="flex:1">เลือกโฟลเดอร์</b>
      <label class="ck"><input type="checkbox" id="pkHidden" onchange="pkGo(PK.path)"> โฟลเดอร์ซ่อน</label>
      <button class="btn quiet" onclick="pkClose()">ปิด</button></div>
    <div class="pkbody">
      <div class="pkside" id="pkPlaces"></div>
      <div class="pkmain"><div class="crumbs" id="pkCrumbs"></div><div class="pklist" id="pkList"></div></div>
    </div>
    <div class="bot"><input id="pkPath" class="f grow mono" onkeydown="if(event.key==='Enter')pkGo(this.value)">
      <button class="btn" onclick="pkGo(document.getElementById('pkPath').value)">ไป</button>
      <button class="btn primary" onclick="pkPick()">ใช้โฟลเดอร์นี้</button></div>
  </div>
</div>

<script>
let SEL = new Map();      // path -> size
let OFFSET = 0, TOTAL = 0, GROUPS = [];
const PK = {target: null, path: ''};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsq = s => JSON.stringify(s).replace(/"/g, '&quot;');
const hum = n => { n = n||0; const u=['B','KB','MB','GB','TB']; let i=0;
  while (n >= 1024 && i < 4) { n/=1024; i++; }
  return (i ? n.toFixed(2) : n) + ' ' + u[i]; };
const badge = (kind, text) => '<span class="badge ' + kind + '">' + text + '</span>';

function toast(text, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 320);
  }, kind === 'bad' ? 6000 : 3800);
}

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify(body)} : undefined);

}

async function startScan() {
  $('scanErr').textContent = '';
  const r = await api('/api/scan', {
    root: $('root').value.trim(),
    min_size: +$('minsize').value,
    hidden: $('hidden').checked,
  });
  if (r.error) { $('scanErr').textContent = r.error; return; }
  poll();
}

let polling = false;
async function poll() {
  if (polling) return; polling = true;
  while (true) {
    const s = await api('/api/state');
    INDEXED = s.indexed || 0;
    $('sIndexed').textContent = INDEXED.toLocaleString();
    const p = s.progress || {};
    $('btnScan').classList.toggle('hide', s.running);
    $('btnCancel').classList.toggle('hide', !s.running);
    $('prog').classList.toggle('hide', !s.running && p.phase !== 'error');
    $('hdrStatus').innerHTML = s.running ? badge('development', 'กำลังสแกน')
      : p.phase === 'error' ? badge('mock', 'สแกนไม่สำเร็จ')
      : p.phase === 'done' ? badge('production', 'สแกนเสร็จแล้ว') : '';

    if (p.phase === 'error') $('scanErr').textContent = p.error;
    const pct = p.bytes_total ? p.bytes_done / p.bytes_total
              : p.total ? p.done / p.total : 0;
    $('progBar').style.width = (pct * 100).toFixed(1) + '%';
    $('progPct').textContent = pct ? (pct * 100).toFixed(0) + '%' : '';
    const label = {walk:'1/4 ไล่รายชื่อไฟล์', index:'2/4 ทำดัชนี',
                   size:'2/4 จัดกลุ่มตามขนาด', head:'3/4 hash หัวไฟล์',
                   full:'4/4 hash เต็มไฟล์'}[p.phase] || p.phase || '';
    $('progText').textContent = label + ' — ' + (p.message || '') +
      (p.bytes_total ? '  (' + hum(p.bytes_done) + ' / ' + hum(p.bytes_total) + ')'
                     : p.total ? '  (' + p.done + ' / ' + p.total + ')' : '');

    if (!s.running) { polling = false; reload(0); return; }
    await new Promise(r => setTimeout(r, 700));
  }
}

let INDEXED = 0;

async function reload(offset) {
  OFFSET = offset;
  if (!GROUPS.length)
    $('groups').innerHTML = '<div class="card skeleton"><i></i><i></i><i></i></div>';
  const d = await api('/api/groups?offset=' + offset + '&limit=' + $('pagesize').value +
                      '&sort=' + $('sort').value + '&q=' + encodeURIComponent($('q').value));
  TOTAL = d.total_groups; GROUPS = d.groups;
  if (INDEXED) slimScan(true);
  $('sGroups').textContent = d.total_groups.toLocaleString();
  $('sFiles').textContent = (d.extra_files || 0).toLocaleString();
  $('sWaste').textContent = d.waste_h;

}

function render() {
  const out = [];
  for (const g of GROUPS) {
    out.push('<div class="grp"><div class="hd">' +
      '<span>ซ้ำ ' + g.files.length + ' ไฟล์</span>' +
      '<span class="muted" style="letter-spacing:0;text-transform:none">ไฟล์ละ ' + g.size_h + '</span>' +
      badge('wine', 'กู้คืนได้ ' + g.waste_h) +
      '<span class="hash">#' + g.hash + '</span></div>');
    for (const f of g.files) {
      const i = f.path.lastIndexOf('/');
      const ext = f.path.split('.').pop().slice(0, 5).toUpperCase();
      const thumb = f.thumb
        ? '<img class="thumb" data-src="/api/thumb?path=' + encodeURIComponent(f.path) +
          '" onerror="this.replaceWith(cellIcon(\'' + esc(ext) + '\',\'thumb\'))"' +
          ' onclick="window.open(\'/api/file?path=' + encodeURIComponent(f.path) + '\')">'
        : '<div class="thumb">' + esc(ext) + '</div>';
      out.push('<label class="f" data-path="' + esc(f.path) + '">' +
        '<input type="checkbox" onchange="toggle(this,' + g.size + ')"' +
          (SEL.has(f.path) ? ' checked' : '') + '>' +
        thumb +
        '<div class="pathwrap"><div class="p"><span class="dir">' +
          esc(f.path.slice(0, i + 1)) + '</span><span class="name">' +
          esc(f.path.slice(i + 1)) + '</span></div>' +
        '<div class="meta">แก้ไขล่าสุด ' + new Date(f.mtime * 1000).toLocaleString('th-TH') +
        '</div></div>' +
        '<span class="tag del">จะถูกย้าย</span><span class="tag keep">เก็บไว้</span>' +
        '<button class="btn sm quiet reveal" title="เปิดตำแหน่งใน Finder" onclick="event.preventDefault();' +
          'fetch(\'/api/reveal?path=' + encodeURIComponent(f.path) + '\')">Finder ↗</button>' +
        '</label>');
    }
    out.push('</div>');
  }
  $('groups').innerHTML = out.join('') || '<div class="card"><div class="empty">' + emptyText() + '</div></div>';

  paintGroups();
  lazyThumbs();
  renderPager();
  updateBar();
}

let io;
function lazyThumbs() {
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting && e.target.dataset.src) {
        e.target.src = e.target.dataset.src;
        delete e.target.dataset.src;
        io.unobserve(e.target);
      }
    }
  }, {rootMargin: '400px'});
  document.querySelectorAll('img[data-src]').forEach(el => io.observe(el));
  // IntersectionObserver ไม่ยิงถ้าหน้าต่างไม่ได้ถูก render (แท็บพื้นหลัง, หน้าต่างซ่อน)
  // เลยเช็คเองอีกชั้นว่ารูปไหนอยู่ในจอแล้วบ้าง
  requestAnimationFrame(() => {
    for (const el of document.querySelectorAll('img[data-src]')) {
      const b = el.getBoundingClientRect();
      if (b.top < innerHeight + 400 && b.bottom > -400) {
        el.src = el.dataset.src; delete el.dataset.src; io.unobserve(el);
      }
    }
  });
}

function renderPager() {
  const n = +$('pagesize').value;
  const page = Math.floor(OFFSET / n) + 1, pages = Math.max(1, Math.ceil(TOTAL / n));
  $('pager').innerHTML =
    '<button class="btn" ' + (OFFSET <= 0 ? 'disabled' : '') + ' onclick="reload(' +
      Math.max(0, OFFSET - n) + ')">← ก่อนหน้า</button>' +
    '<span class="muted">หน้า ' + page + ' / ' + pages + '</span>' +
    '<button class="btn" ' + (OFFSET + n >= TOTAL ? 'disabled' : '') + ' onclick="reload(' +
      (OFFSET + n) + ')">ถัดไป →</button>';
}

function toggle(cb, size) {
  const path = cb.closest('.f').dataset.path;
  if (cb.checked) SEL.set(path, size); else SEL.delete(path);
  paintGroups();
  updateBar();
}

function updateBar() {
  let bytes = 0;
  SEL.forEach(v => bytes += v);
  $('selCount').textContent = SEL.size;
  $('selBytes').textContent = SEL.size ? 'จะได้พื้นที่คืน ' + hum(bytes) : 'ยังไม่ได้เลือกอะไร';
  $('btnDel').disabled = SEL.size === 0;
  $('btnClear').classList.toggle('hide', SEL.size === 0);
}

function clearSel() {
  SEL.clear();
  document.querySelectorAll('.f input[type=checkbox]').forEach(c => c.checked = false);
  paintGroups();
  updateBar();
}

function autoSelect() {
  const rule = $('rule').value, pref = $('prefer').value.trim();
  let skipped = 0;
  for (const g of GROUPS) {
    const files = g.files.slice();
    let keep;
    if (rule === 'old')        keep = files.reduce((a, b) => a.mtime <= b.mtime ? a : b);
    else if (rule === 'new')   keep = files.reduce((a, b) => a.mtime >= b.mtime ? a : b);
    else if (rule === 'short') keep = files.reduce((a, b) => a.path.length <= b.path.length ? a : b);
    else {
      if (!pref) { toast('ใส่โฟลเดอร์ที่อยากเก็บก่อนครับ', 'bad'); return; }
      const inside = files.filter(f => f.path.startsWith(pref));
      if (inside.length === 0 || inside.length === files.length) { skipped++; continue; }
      keep = inside.reduce((a, b) => a.mtime <= b.mtime ? a : b);
    }
    for (const f of files) if (f.path !== keep.path) SEL.set(f.path, g.size);
  }
  if (skipped) toast('ข้ามไป ' + skipped + ' กลุ่มที่กำกวม — ไม่ได้ติ๊กอะไรให้');
  document.querySelectorAll('.f').forEach(el => {
    const cb = el.querySelector('input[type=checkbox]');
    if (cb) cb.checked = SEL.has(el.dataset.path);
  });
  paintGroups();
  updateBar();
}

let QB = [];                      // รายชื่อชุด (อ้างด้วย index เพราะ batch ซ้ำข้าม root ได้)
const QOPEN = new Set();
const QVIEW = {}, QSHOWN = {};
const QCAP = 60;                  // โชว์กี่ไฟล์ก่อนต้องกด "ดูเพิ่ม"

async function loadBatches() {
  QB = await api('/api/batches');
  $('navQCount').textContent = QB.length || '';
  if (!QB.length) {
    $('batches').innerHTML = '<div class="card"><div class="empty">ถังพักไฟล์ว่างอยู่</div></div>';
    return;
  }
  $('batches').innerHTML = QB.map((x, i) => {
    const open = QOPEN.has(i), gone = !x.available;
    return '<div class="card">' +
      '<div class="qhead' + (open ? ' open' : '') + '" onclick="qToggle(event,' + i + ')">' +
        '<span class="caret">›</span>' +
        '<div class="grow">' +
          '<div class="row" style="gap:10px">' +
            '<b class="mono" style="font-size:.9375rem">' + esc(x.batch) + '</b>' +
            (gone ? badge('mock', 'หาโฟลเดอร์ไม่เจอ') : badge('production', 'พร้อมคืนกลับ')) +
          '</div>' +
          '<div class="meta">' + x.files + ' ไฟล์ · ' + x.bytes_h +
            (x.undone ? ' · คืนกลับแล้ว ' + x.undone + ' ไฟล์' : '') + '</div>' +
          '<div class="meta mono">' + esc(x.root) + '</div>' +
        '</div>' +
        '<button class="btn sm" ' + (gone ? 'disabled' : '') +
          ' onclick="event.stopPropagation();undo(' + i + ')">คืนกลับที่เดิม</button>' +
        '<button class="btn sm danger" ' + (gone ? 'disabled' : '') +
          ' onclick="event.stopPropagation();purge(' + i + ')">ลบถาวร</button>' +
      '</div>' +
      (gone ? '<p class="meta" style="margin:12px 0 0">ไดรฟ์อาจไม่ได้เสียบอยู่ — ' +
              'ระบบจะไม่ยอมลบบัญชีทิ้งจนกว่าจะเจอโฟลเดอร์จริง</p>' : '') +
      '<div class="qbody' + (open ? '' : ' hide') + '" id="qb-' + i + '"></div>' +
    '</div>';
  }).join('');
  for (const i of QOPEN) qRender(i);
}

function qToggle(e, i) {
  if (e.target.closest('button.btn')) return;
  const open = QOPEN.has(i);
  open ? QOPEN.delete(i) : QOPEN.add(i);
  $('qb-' + i).parentElement.querySelector('.qhead').classList.toggle('open', !open);
  $('qb-' + i).classList.toggle('hide', open);
  if (!open) qRender(i);
}

function qView(i, mode) { QVIEW[i] = mode; qRender(i); }
function qMore(i) { QSHOWN[i] = (QSHOWN[i] || QCAP) + QCAP; qRender(i); }

async function qRender(i) {
  const box = $('qb-' + i), b = QB[i];
  if (!box || !b) return;
  if (!box.dataset.loaded) box.innerHTML = '<div class="meta">กำลังโหลด…</div>';
  const files = await api('/api/batch?batch=' + encodeURIComponent(b.batch) +
                          '&root=' + encodeURIComponent(b.root));
  box.dataset.loaded = '1';

  const live = files.filter(f => f.exists && !f.undone);
  const mode = QVIEW[i] || 'grid';
  const shown = QSHOWN[i] || QCAP;
  const slice = live.slice(0, shown);

  let html = '<div class="qtools">' +
    '<span class="grow meta">อยู่ในถัง ' + live.length + ' ไฟล์' +
      (live.length > shown ? ' (แสดง ' + shown + ')' : '') + '</span>' +
    '<div class="seg">' +
      '<button class="' + (mode === 'grid' ? 'on' : '') + '" onclick="qView(' + i + ',\'grid\')">ตาราง</button>' +
      '<button class="' + (mode === 'list' ? 'on' : '') + '" onclick="qView(' + i + ',\'list\')">รายการ</button>' +
    '</div></div>';

  if (!live.length) {
    html += '<div class="empty">ไม่มีไฟล์เหลือในชุดนี้แล้ว (คืนกลับหมด หรือเข้าถึงไฟล์ไม่ได้)</div>';
  } else if (mode === 'grid') {
    html += '<div class="qgrid">' + slice.map(f => {
      const name = f.src.slice(f.src.lastIndexOf('/') + 1);
      const ext = f.src.split('.').pop().slice(0, 5).toUpperCase();
      return '<div class="qcell">' + qThumb(f, ext, 'th') +
        '<div class="cap" title="' + esc(f.src) + '"><b>' + esc(name) + '</b>' +
        '<span>' + f.size_h + '</span></div></div>';
    }).join('') + '</div>';
  } else {
    html += slice.map(f => {
      const j = f.src.lastIndexOf('/');
      const ext = f.src.split('.').pop().slice(0, 5).toUpperCase();
      return '<div class="qrow">' + qThumb(f, ext, 'thumb') +
        '<div class="pathwrap"><div class="p"><span class="dir">' +
          esc(f.src.slice(0, j + 1)) + '</span><span class="name">' +
          esc(f.src.slice(j + 1)) + '</span></div>' +
        '<div class="meta">' + f.size_h + ' · ย้ายมาจากตำแหน่งนี้</div></div>' +
        '<button class="btn sm quiet" onclick="fetch(\'/api/reveal?path=' +
          encodeURIComponent(f.dst) + '\')">Finder ↗</button>' +
        '<button class="btn sm" onclick="undoOne(' + i + ',' + jsq(f.dst) + ')">คืนกลับ</button>' +
        '</div>';
    }).join('');
  }
  if (live.length > shown)
    html += '<div class="qmore"><button class="btn" onclick="qMore(' + i + ')">ดูเพิ่มอีก ' +
      Math.min(QCAP, live.length - shown) + ' ไฟล์</button></div>';

  box.innerHTML = html;
  lazyThumbs();
}

function qThumb(f, ext, cls) {
  const url = '/api/file?path=' + encodeURIComponent(f.dst);
  if (!f.thumb) return '<div class="' + cls + '" onclick="window.open(\'' + url +
    '\')">' + esc(ext) + '</div>';
  return '<img class="' + cls + '" data-src="/api/thumb?path=' + encodeURIComponent(f.dst) +
    '" onerror="this.replaceWith(cellIcon(\'' + esc(ext) + '\',\'' + cls + '\'))"' +
    ' onclick="window.open(\'' + url + '\')">';
}

function slimScan(on) {
  $('scanFull').classList.toggle('hide', on);
  $('scanSlim').classList.toggle('hide', !on);
  if (on) { $('slimPath').textContent = $('root').value;
            $('slimCount').textContent = INDEXED.toLocaleString() + ' ไฟล์'; }
}
function editScan() { slimScan(false); $('root').focus(); }

function emptyText() {
  if (!INDEXED) return '<b>ยังไม่ได้สแกน</b>เลือกโฟลเดอร์ด้านบนแล้วกด “เริ่มสแกน”';
  if ($('q').value.trim()) return '<b>ไม่มีกลุ่มที่ตรงกับตัวกรอง</b>ลองล้างช่องค้นหาบนแถบด้านบน';
  return '<b>ไม่พบไฟล์ซ้ำเลย</b>ทุกไฟล์ในโฟลเดอร์นี้มีเนื้อไฟล์ไม่ซ้ำกัน';
}

/* ทาสีทีละกลุ่ม: ตัวที่ติ๊ก = จะถูกย้าย, ตัวที่เหลือในกลุ่มเดียวกัน = เก็บไว้
   ทำให้เห็นทันทีว่ากดแล้วจะเหลืออะไร โดยไม่ต้องไล่อ่านทีละบรรทัด */
function paintGroups() {
  document.querySelectorAll('.grp').forEach(g => {
    const rows = [...g.querySelectorAll('.f')];
    const anySel = rows.some(r => SEL.has(r.dataset.path));
    for (const r of rows) {
      const sel = SEL.has(r.dataset.path);
      r.classList.toggle('sel', sel);
      r.classList.toggle('keep', anySel && !sel);
    }
  });
}

function cellIcon(ext, cls) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = ext;
  return d;
}

async function undoOne(i, dst) {
  const b = QB[i];
  const r = await api('/api/undo', {batch: b.batch, root: b.root, paths: [dst]});
  if (r.error) toast(r.error, 'bad');
  else if (r.failed.length) toast('คืนกลับไม่สำเร็จ: ' + r.failed[0].error, 'bad');
  else toast('คืนกลับที่เดิมแล้ว 1 ไฟล์', 'ok');
  loadBatches();
  reload(OFFSET);
}

async function undo(i) {
  const b = QB[i];
  if (!confirm('คืนไฟล์ทั้งชุด ' + b.batch + ' กลับที่เดิม?')) return;
  const r = await api('/api/undo', {batch: b.batch, root: b.root});
  toast(r.error ? r.error
        : 'คืนกลับแล้ว ' + r.restored + ' ไฟล์' +
          (r.failed.length ? ' · ล้มเหลว ' + r.failed.length + ' ไฟล์' : ''),
        r.error ? 'bad' : 'ok');
  loadBatches();
  reload(OFFSET);
}

async function purge(i) {
  const b = QB[i];
  if (!confirm('ลบชุด ' + b.batch + ' อย่างถาวร?\n\n' + b.root + '\n\nกู้คืนไม่ได้อีกแล้วนะครับ')) return;
  const r = await api('/api/purge', {batch: b.batch, root: b.root});
  toast(r.error || 'ลบชุด ' + b.batch + ' ถาวรแล้ว', r.error ? 'bad' : 'ok');
  loadBatches();
}

// ---- ตามหาถังพักที่ค้างอยู่ ----
async function findQ() {
  $('findOut').innerHTML = '<div class="meta" style="margin-top:16px">กำลังค้นหา…</div>';
  const r = await api('/api/find_quarantine?path=' + encodeURIComponent($('findPath').value.trim()));
  if (!r.length) {
    $('findOut').innerHTML = '<div class="meta" style="margin-top:16px">ไม่เจอถังพักไฟล์ในโฟลเดอร์นี้</div>';
    return;
  }
  const orphans = r.filter(x => x.orphan);
  $('findOut').innerHTML = '<div style="margin-top:16px;border-top:1px solid var(--outline)">' +
    r.map(x =>
      '<div class="qrow"><div class="pathwrap">' +
        '<div class="p"><span class="name">' + esc(x.dir) + '</span></div>' +
        '<div class="row" style="gap:6px;margin-top:4px">' +
          '<span class="meta">' + x.files + ' ไฟล์ · ' + x.bytes_h + '</span>' +
          (x.manifest ? badge('integrated', 'มี manifest')
                      : badge('planned', 'กู้จากโครงสร้างโฟลเดอร์')) +
          (x.orphan ? badge('mock', 'ระบบยังไม่รู้จัก') : badge('production', 'อยู่ในบัญชีแล้ว')) +
        '</div></div>' +
      (x.orphan ? '<button class="btn sm primary" onclick="adopt([' + jsq(x.dir) +
        '])">ดึงกลับเข้าระบบ</button>' : '') +
      '</div>').join('') +
    (orphans.length > 1 ? '<div class="qmore"><button class="btn primary" onclick="adopt(' +
      jsq(orphans.map(o => o.dir)).replace(/&quot;/g, '&quot;') +
      ')">ดึงกลับทั้งหมด ' + orphans.length + ' ชุด</button></div>' : '') +
    '</div>';
}

async function adopt(dirs) {
  const r = await api('/api/adopt', {dirs});
  toast('ดึงกลับเข้าระบบแล้ว ' + r.added + ' ไฟล์', 'ok');
  findQ();
  loadBatches();
}

// ------------------------------------------------------------------ เริ่ม
(async () => {
  const s = await api('/api/state');
  $('root').value = s.root || '';
  INDEXED = s.indexed || 0;
  $('sIndexed').textContent = INDEXED.toLocaleString();
  if (s.min_size) $('minsize').value = String(s.min_size);
  if (s.running) poll(); else reload(0);
})();
</script>
